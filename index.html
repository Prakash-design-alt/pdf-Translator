<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Translator (Layout Preserved)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Arabic&family=Noto+Sans+SC&family=Noto+Sans+JP&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
  env.allowLocalModels = false;
  env.useBrowserCache = true;
  window.Transformers = { pipeline };
</script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#2563eb;--border:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px;background:var(--card);border-bottom:1px solid var(--border)}
h1{margin:0;font-size:20px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:1000px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.hover{border-color:var(--accent);background:#eff6ff}
.drop strong{color:var(--text)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--text);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;display:inline-block}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
a.dl{border:1px solid var(--border);border-radius:8px;padding:10px 18px;color:var(--text);font-size:14px;text-decoration:none;background:#fff}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}
.bar div{height:100%;width:0;background:var(--accent);transition:width .3s}
.hidden{display:none!important}
.note{font-size:13px;color:var(--muted);margin-top:10px;word-break:break-word}
#pdfPreview{width:100%;height:75vh;min-height:520px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-top:14px}
.preview-title{font-size:14px;font-weight:600;margin-top:18px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:999}
.loadbox{background:#fff;border-radius:12px;padding:28px 32px;width:min(420px,90vw);text-align:center}
.spinner{width:46px;height:46px;border:4px solid #e3e6ec;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadText{font-size:14px;color:var(--text);margin-bottom:12px;min-height:20px;word-break:break-word}
.footer{margin-top:24px;padding:18px 16px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--border);background:var(--card)}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>PDF Translator <span class="badge">AI translation in your browser</span></h1>
  <p>Translates the text in your PDF and keeps the original layout, tables, and images. Runs in your browser.</p>
</header>

<main>
  <section class="card">
    <div class="grid">
      <div>
        <label for="ocrLang">Language of the PDF</label>
        <select id="ocrLang">
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="ur">Urdu</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="hi">Hindi</option>
          <option value="ru">Russian</option>
          <option value="zh">Chinese (Simplified)</option>
        </select>
      </div>
      <div>
        <label for="ocrMode">OCR mode</label>
        <select id="ocrMode">
          <option value="auto">Auto (only pages without text)</option>
          <option value="force">Always OCR</option>
          <option value="off">Never OCR</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <label>Target languages (select one or more)</label>
      <div class="langs" id="langs"></div>
    </div>
  </section>

  <section class="card">
    <div id="drop" class="drop">
      <strong>Click or drop a PDF here</strong>
      <div id="fileName" style="margin-top:6px;font-size:14px"></div>
    </div>
    <input id="file" type="file" accept="application/pdf" class="hidden">
    <div class="row">
      <button id="start">Translate PDF</button>
      <span id="status" style="font-size:14px;color:var(--muted)"></span>
    </div>
  </section>

  <section class="card hidden" id="results">
    <div class="row" id="downloads"></div>
    <p class="note" id="previewNote"></p>
    <div class="row" id="previewTabs"></div>
    <div class="preview-title">PDF preview</div>
    <iframe id="pdfPreview" title="Translated PDF preview" class="hidden"></iframe>
  </section>
</main>

<div id="loading" class="overlay hidden">
  <div class="loadbox">
    <div class="spinner"></div>
    <div id="loadText">Starting...</div>
    <div class="bar"><div id="bar"></div></div>
  </div>
</div>

<footer class="footer">
  <div class="wrap">
    <span>© <span id="yr">2026</span> Next2pdf. Built by Prakash Budhathoki.</span>
  </div>
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { jsPDF } = window.jspdf;
const $ = id => document.getElementById(id);

const LANG_MAP = {
  en: { name: "English", tesseract: "eng", m2m: "en" },
  ar: { name: "Arabic", tesseract: "ara", m2m: "ar" },
  ur: { name: "Urdu", tesseract: "urd", m2m: "ur" },
  fr: { name: "French", tesseract: "fra", m2m: "fr" },
  de: { name: "German", tesseract: "deu", m2m: "de" },
  es: { name: "Spanish", tesseract: "spa", m2m: "es" },
  hi: { name: "Hindi", tesseract: "hin", m2m: "hi" },
  ru: { name: "Russian", tesseract: "rus", m2m: "ru" },
  zh: { name: "Chinese (Simplified)", tesseract: "chi_sim", m2m: "zh" },
  tr: { name: "Turkish", tesseract: "tur", m2m: "tr" },
  ja: { name: "Japanese", tesseract: "jpn", m2m: "ja" },
  pt: { name: "Portuguese", tesseract: "por", m2m: "pt" },
  it: { name: "Italian", tesseract: "ita", m2m: "it" }
};

// Small, fast per-pair models (Helsinki-NLP / Marian, quantized for browsers)
const DIRECT = {
  "ar>en": "Xenova/opus-mt-ar-en", "de>en": "Xenova/opus-mt-de-en",
  "fr>en": "Xenova/opus-mt-fr-en", "zh>en": "Xenova/opus-mt-zh-en",
  "it>en": "Xenova/opus-mt-it-en",
  "en>ar": "Xenova/opus-mt-en-ar", "en>de": "Xenova/opus-mt-en-de",
  "en>es": "Xenova/opus-mt-en-es", "en>fr": "Xenova/opus-mt-en-fr",
  "en>hi": "Xenova/opus-mt-en-hi", "en>it": "Xenova/opus-mt-en-it",
  "en>zh": "Xenova/opus-mt-en-zh"
};
// Fallback for pairs without a small model (slower, larger)
const FALLBACK_MODEL = "Xenova/m2m100_418M";
const BATCH_SMALL = 3;
const BATCH_FALLBACK = 1;
const RTL_LANGS = ["ar", "ur"];
const FONT = `"Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans JP", "Noto Sans Devanagari", sans-serif`;
const RENDER_SCALE = 2;

let pdfFile = null;
let ocrWorker = null;
let ocrWorkerLang = null;
let failedMsgs = [];
let generatedUrls = [];
let isTranslating = false;
const modelCache = new Map();

/* ---------- UI ---------- */
["ar","ur","fr","es","de","zh","hi","ru","tr","ja","pt","it","en"].forEach((code, i) => {
  const lab = document.createElement("label");
  lab.className = "chip";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = code;
  cb.checked = i === 0;
  lab.append(cb, LANG_MAP[code].name);
  $("langs").append(lab);
});

const drop = $("drop");
const fileIn = $("file");
drop.onclick = () => fileIn.click();
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
fileIn.onchange = () => setFile(fileIn.files[0]);

function setFile(f) {
  if (!f) return;
  if (!f.name.toLowerCase().endsWith(".pdf")) { alert("Please choose a PDF file."); return; }
  pdfFile = f;
  $("fileName").textContent = `${f.name} (${(f.size / 1048576).toFixed(2)} MB)`;
}

function setStatus(msg) {
  $("status").textContent = msg;
  $("loadText").textContent = msg;
}
function setProgress(f) {
  $("bar").style.width = Math.max(0, Math.min(100, Math.round(f * 100))) + "%";
}

/* ---------- Translation engine ---------- */
async function waitForLibrary() {
  const start = Date.now();
  while (!window.Transformers) {
    if (Date.now() - start > 30000) {
      throw new Error("The AI library could not load. Check your internet connection and try again.");
    }
    await new Promise(r => setTimeout(r, 100));
  }
}

function loadModel(id) {
  if (!modelCache.has(id)) {
    const job = (async () => {
      await waitForLibrary();
      const short = id.split("/")[1];
      setStatus(`Loading translation model "${short}" (first time only, may take a minute)...`);
      try {
        return await window.Transformers.pipeline("translation", id, {
          progress_callback: p => {
            if (p.status === "progress") setStatus(`Downloading "${short}": ${Math.round(p.progress || 0)}%`);
          }
        });
      } catch (err) {
        modelCache.delete(id);
        throw err;
      }
    })();
    modelCache.set(id, job);
  }
  return modelCache.get(id);
}

// Choose the fastest route: direct small model, English pivot, or fallback
function planRoute(src, tgt) {
  const direct = DIRECT[`${src}>${tgt}`];
  if (direct) return [{ model: direct, src, tgt, fallback: false }];
  if (src !== "en" && tgt !== "en" && DIRECT[`${src}>en`] && DIRECT[`en>${tgt}`]) {
    return [
      { model: DIRECT[`${src}>en`], src, tgt: "en", fallback: false },
      { model: DIRECT[`en>${tgt}`], src: "en", tgt, fallback: false }
    ];
  }
  return [{ model: FALLBACK_MODEL, src, tgt, fallback: true }];
}

async function runStep(step, texts, label) {
  const pipe = await loadModel(step.model);
  const size = step.fallback ? BATCH_FALLBACK : BATCH_SMALL;
  const out = [];
  for (let i = 0; i < texts.length; i += size) {
    const batch = texts.slice(i, i + size);
    setStatus(`${label}: translating lines ${i + 1}-${Math.min(i + size, texts.length)} of ${texts.length}...`);
    const opts = step.fallback ? { src_lang: LANG_MAP[step.src].m2m, tgt_lang: LANG_MAP[step.tgt].m2m } : {};
    const raw = await pipe(batch, opts);
    const res = Array.isArray(raw) ? raw : [raw];
    for (const r of res) out.push(r.translation_text || batch[out.length % size]);
    setStatus(`${label}: ${Math.min(i + size, texts.length)}/${texts.length} lines`);
    // Give the browser time to repaint progress and keep the page responsive.
    await new Promise(resolve => setTimeout(resolve, 0));
  }
  return out;
}

// Translate many lines at once: skip non-text, translate each unique line once
async function translateTexts(texts, src, tgt, label) {
  const hasLetters = texts.map(t => /\p{L}/u.test(t));
  const unique = [...new Set(texts.filter((t, i) => hasLetters[i]))];
  if (!unique.length) return texts.slice();

  let current = unique;
  for (const step of planRoute(src, tgt)) {
    current = await runStep(step, current, label);
  }
  const map = new Map(unique.map((t, i) => [t, current[i]]));
  return texts.map((t, i) => (hasLetters[i] && map.has(t) ? map.get(t) : t));
}

/* ---------- PDF analysis ---------- */
function textLines(content, vp) {
  const boxes = [];
  for (const it of content.items) {
    if (!it.str || !it.str.trim()) continue;
    const t = pdfjsLib.Util.transform(vp.transform, it.transform);
    boxes.push({ str: it.str, x: t[4], base: t[5], h: Math.hypot(t[2], t[3]), w: it.width * vp.scale });
  }
  boxes.sort((a, b) => a.base - b.base);

  const groups = [];
  let cur = null;
  for (const b of boxes) {
    if (cur && Math.abs(b.base - cur.base) < cur.h * 0.5) cur.items.push(b);
    else { if (cur) groups.push(cur); cur = { base: b.base, h: b.h, items: [b] }; }
  }
  if (cur) groups.push(cur);

  return groups.map(g => {
    g.items.sort((a, b) => a.x - b.x);
    const x0 = g.items[0].x;
    const x1 = Math.max(...g.items.map(i => i.x + i.w));
    return {
      text: g.items.map(i => i.str).join(" ").replace(/\s+/g, " ").trim(),
      x: x0, w: x1 - x0, base: g.base, h: g.h
    };
  });
}

function ocrLines(data) {
  const out = [];
  for (const b of data.blocks || [])
    for (const p of b.paragraphs || [])
      for (const l of p.lines || []) {
        const text = (l.text || "").trim();
        if (!text) continue;
        const { x0, y0, x1, y1 } = l.bbox;
        const h = y1 - y0;
        out.push({ text, x: x0, w: x1 - x0, base: y1 - h * 0.2, h });
      }
  return out;
}

async function renderCanvas(page, vp) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return canvas;
}

async function getOcr(srcCode) {
  const tess = LANG_MAP[srcCode].tesseract;
  if (ocrWorker && ocrWorkerLang === tess) return ocrWorker;
  if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; }
  setStatus(`Loading OCR engine for "${tess}"...`);
  ocrWorker = await Tesseract.createWorker(tess, 1);
  ocrWorkerLang = tess;
  return ocrWorker;
}

async function analyzePage(pdf, n, mode, srcCode, failures) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: RENDER_SCALE });
  const canvas = await renderCanvas(page, vp); // rendered once, reused for every language
  let lines = textLines(await page.getTextContent(), vp);
  let method = "text";
  const textLen = lines.map(l => l.text).join("").replace(/\s/g, "").length;
  const needsOcr = mode === "force" || (mode === "auto" && textLen < 30);
  if (needsOcr && mode !== "off") {
    try {
      setStatus(`Reading scanned page ${n} with OCR...`);
      const worker = await getOcr(srcCode);
      const { data } = await worker.recognize(canvas, {}, { blocks: true });
      lines = ocrLines(data);
      method = "OCR";
    } catch (err) {
      console.warn("OCR failed on page", n, err);
      failures.push(`page ${n} OCR: ${err.message}`);
      ocrWorker = null;
      ocrWorkerLang = null;
      method = "OCR failed";
    }
  }
  return { n, canvas, lines, method, width: vp.width / RENDER_SCALE, height: vp.height / RENDER_SCALE };
}

/* ---------- Drawing ---------- */
function fitText(ctx, text, size, maxW) {
  let s = size;
  ctx.font = `${s}px ${FONT}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) {
    s = Math.max(size * maxW / w, size * 0.45);
    ctx.font = `${s}px ${FONT}`;
  }
  return s;
}

function drawPage(P, tgt) {
  const canvas = document.createElement("canvas");
  canvas.width = P.canvas.width;
  canvas.height = P.canvas.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(P.canvas, 0, 0);

  const rtl = RTL_LANGS.includes(tgt);
  const pad = 2;

  // Sample background color behind each line, then erase the original text
  const boxes = P.lines.map(L => {
    const x = L.x - pad, y = L.base - L.h * 0.85 - pad;
    const w = L.w + pad * 2, h = L.h * 1.1 + pad * 2;
    const px = ctx.getImageData(Math.max(0, Math.floor(x - 3)), Math.max(0, Math.floor(y + h / 2)), 1, 1).data;
    return { L, x, y, w, h, color: `rgb(${px[0]},${px[1]},${px[2]})` };
  });
  for (const b of boxes) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // Draw translated text in the same place
  ctx.fillStyle = "#111";
  for (const b of boxes) {
    const text = b.L.tr && b.L.tr[tgt] ? b.L.tr[tgt] : b.L.text;
    const maxW = Math.max(b.L.w, Math.min(b.L.w * 1.3, canvas.width - b.L.x - 10));
    fitText(ctx, text, b.L.h * 0.9, maxW);
    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(text, rtl ? b.L.x + maxW : b.L.x, b.L.base);
  }
  return canvas;
}

async function loadFonts() {
  await Promise.all([
    "16px 'Noto Sans'", "16px 'Noto Sans Arabic'", "16px 'Noto Sans SC'",
    "16px 'Noto Sans JP'", "16px 'Noto Sans Devanagari'"
  ].map(f => document.fonts.load(f).catch(() => {})));
}

/* ---------- Pipeline ---------- */
$("start").onclick = run;

async function run() {
  if (!pdfFile) return alert("Choose a PDF file first.");
  const targets = [...document.querySelectorAll("#langs input:checked")].map(i => i.value);
  if (!targets.length) return alert("Select at least one target language.");
  const srcCode = $("ocrLang").value;
  if (targets.includes(srcCode)) {
    return alert(`The PDF is set to ${LANG_MAP[srcCode].name}, so it cannot be a target. ` +
                 `Untick it, or change "Language of the PDF".`);
  }

  $("start").disabled = true;
  $("results").classList.add("hidden");
  $("loading").classList.remove("hidden");
  $("downloads").innerHTML = "";
  $("previewTabs").innerHTML = "";
  $("previewNote").textContent = "";
  failedMsgs = [];
  setProgress(0);
  setStatus("Starting...");

  if (isTranslating) return;
  isTranslating = true;
  generatedUrls.forEach(url => URL.revokeObjectURL(url));
  generatedUrls = [];
  $("pdfPreview").classList.add("hidden");
  $("pdfPreview").removeAttribute("src");

  try {
    await loadFonts();
    const pdf = await pdfjsLib.getDocument({ data: await pdfFile.arrayBuffer() }).promise;
    const n = pdf.numPages;
    const mode = $("ocrMode").value;

    // Stage 1: read every page once (20% of progress)
    const pages = [];
    for (let i = 1; i <= n; i++) {
      setStatus(`Reading page ${i}/${n}...`);
      try {
        pages.push(await analyzePage(pdf, i, mode, srcCode, failedMsgs));
      } catch (pageErr) {
        console.error(`Failed to read page ${i}`, pageErr);
        failedMsgs.push(`Page ${i} could not be processed: ${pageErr.message}`);
        throw new Error(`Could not process page ${i} of ${n}: ${pageErr.message}`);
      }
      setProgress(0.2 * i / n);
      await new Promise(resolve => setTimeout(resolve, 0));
    }
    if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; ocrWorkerLang = null; }

    // Stage 2: translate all lines of all pages in one batch per language
    const allLines = pages.flatMap(p => p.lines);
    const baseName = pdfFile.name.replace(/\.pdf$/i, "");
    const blobs = {};

    if (!allLines.some(L => /\p{L}/u.test(L.text || ""))) {
      throw new Error("No readable text was found in this PDF. If it is a scanned document, set OCR mode to Always OCR and choose the correct PDF language, then try again.");
    }

    for (let li = 0; li < targets.length; li++) {
      const tgt = targets[li];
      const langName = LANG_MAP[tgt].name;
      const span = 0.8 / targets.length;
      const start = 0.2 + li * span;

      let translated;
      try {
        translated = await translateTexts(allLines.map(L => L.text), srcCode, tgt, `Translating into ${langName}`);
      } catch (err) {
        console.error(`Translation failed for ${langName}`, err);
        throw new Error(`Translation into ${langName} failed. The translation model could not load or run. Check your internet connection, refresh the page, and try again. Details: ${err.message}`);
      }
      allLines.forEach((L, i) => { L.tr = L.tr || {}; L.tr[tgt] = translated[i]; });
      setProgress(start + span * 0.7);

      // Stage 3: draw pages and build the PDF
      let doc = null;
      for (let i = 0; i < pages.length; i++) {
        const P = pages[i];
        setStatus(`Building ${langName} PDF: page ${P.n}/${pages.length}`);
        const canvas = drawPage(P, tgt);
        const img = canvas.toDataURL("image/jpeg", 0.88);
        canvas.width = 1; canvas.height = 1;
        const orient = P.width > P.height ? "landscape" : "portrait";
        if (!doc) doc = new jsPDF({ unit: "pt", format: [P.width, P.height], orientation: orient });
        else doc.addPage([P.width, P.height], orient);
        doc.addImage(img, "JPEG", 0, 0, P.width, P.height);
      }
      blobs[langName] = { blob: doc.output("blob"), name: `${baseName}_${tgt}.pdf` };
      setProgress(start + span);
    }

    showDownloads(blobs);
    setProgress(1);
    setStatus("Finished");
  } catch (e) {
    console.error(e);
    setStatus("Failed");
    $("previewNote").textContent = "Translation failed: " + e.message;
    $("results").classList.remove("hidden");
    $("pdfPreview").classList.add("hidden");
    $("pdfPreview").removeAttribute("src");
    alert("Translation failed: " + e.message);
  } finally {
    $("start").disabled = false;
    $("loading").classList.add("hidden");
    isTranslating = false;
  }
}

function showDownloads(blobs) {
  const dl = $("downloads");
  const tabs = $("previewTabs");
  let firstUrl = null;
  Object.entries(blobs).forEach(([langName, { blob, name }]) => {
    const url = URL.createObjectURL(blob);
    generatedUrls.push(url);
    if (!firstUrl) firstUrl = url;

    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.textContent = `Download ${langName} PDF`;
    a.className = "dl";
    dl.append(a);

    const v = document.createElement("button");
    v.className = "secondary";
    v.textContent = `Preview ${langName} PDF`;
    v.onclick = () => {
      $("pdfPreview").src = url;
      $("pdfPreview").classList.remove("hidden");
      $("previewNote").textContent = `Previewing ${langName}. Use the download button to save a copy.`;
    };
    tabs.append(v);

    const open = document.createElement("button");
    open.className = "secondary";
    open.textContent = `Open ${langName} in new tab`;
    open.onclick = () => window.open(url, "_blank", "noopener");
    tabs.append(open);
  });
  $("results").classList.remove("hidden");
  if (firstUrl) {
    $("pdfPreview").src = firstUrl;
    $("pdfPreview").classList.remove("hidden");
    $("previewNote").textContent = "Translation finished. The first translated PDF is shown below; use the buttons to preview another language or open it in a new tab.";
  }
  if (failedMsgs.length) {
    $("previewNote").textContent += ` Note: ${failedMsgs[0]}`;
  }
}
</script>

</html>
