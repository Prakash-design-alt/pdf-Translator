<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Translator (Layout Preserved)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Arabic&family=Noto+Sans+SC&family=Noto+Sans+JP&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#2563eb;--border:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px;background:var(--card);border-bottom:1px solid var(--border)}
h1{margin:0;font-size:20px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:1000px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.hover{border-color:var(--accent);background:#eff6ff}
.drop strong{color:var(--text)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--text);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}
.bar div{height:100%;width:0;background:var(--accent);transition:width .3s}
#log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;height:160px;overflow:auto;white-space:pre-wrap;margin-top:12px}
.hidden{display:none!important}
iframe{width:100%;height:700px;border:1px solid var(--border);border-radius:8px;margin-top:12px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>PDF Translator (Layout Preserved)</h1>
  <p>Translates the text inside your PDF and keeps the original page layout, images, and tables. Scanned pages are read with OCR automatically.</p>
</header>

<main>
  <section class="card controls">
    <div class="grid">
      <div>
        <label for="ocrLang">Language of the PDF</label>
        <select id="ocrLang">
          <option value="eng">English</option>
          <option value="ara">Arabic</option>
          <option value="urd">Urdu</option>
          <option value="fra">French</option>
          <option value="deu">German</option>
          <option value="spa">Spanish</option>
          <option value="hin">Hindi</option>
          <option value="rus">Russian</option>
          <option value="chi_sim">Chinese (Simplified)</option>
        </select>
      </div>
      <div>
        <label for="ocrMode">OCR mode</label>
        <select id="ocrMode">
          <option value="auto">Auto (only pages without text)</option>
          <option value="force">Always OCR</option>
          <option value="off">Never OCR</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <label>Target languages (select one or more)</label>
      <div class="langs" id="langs"></div>
    </div>
  </section>

  <section class="card">
    <div id="drop" class="drop">
      <strong>Click or drop a PDF here</strong>
      <div id="fileName" style="margin-top:6px;font-size:14px"></div>
    </div>
    <input id="file" type="file" accept="application/pdf" class="hidden">
    <div class="row">
      <button id="start">Translate PDF</button>
      <span id="status" style="font-size:14px;color:var(--muted)"></span>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div id="log">Ready.</div>
  </section>

  <section class="card hidden" id="results">
    <div class="row" id="downloads"></div>
    <p class="note">Preview of the translated PDF:</p>
    <div class="row" id="previewTabs"></div>
    <iframe id="preview"></iframe>
  </section>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { jsPDF } = window.jspdf;

const $ = id => document.getElementById(id);

// OCR/source language codes -> MyMemory codes
const SOURCE_CODES = {
  eng: "en-GB", ara: "ar-SA", urd: "ur-PK", fra: "fr-FR", deu: "de-DE",
  spa: "es-ES", hin: "hi-IN", rus: "ru-RU", chi_sim: "zh-CN"
};
// Display names -> MyMemory target codes
const TARGET_CODES = {
  "Arabic": "ar-SA", "Urdu": "ur-PK", "French": "fr-FR", "Spanish": "es-ES",
  "German": "de-DE", "Chinese (Simplified)": "zh-CN", "Hindi": "hi-IN",
  "Russian": "ru-RU", "Turkish": "tr-TR", "Japanese": "ja-JP",
  "Portuguese": "pt-PT", "Italian": "it-IT", "English": "en-GB"
};
const RTL_LANGS = ["Arabic", "Urdu"];
const FONT = `"Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans JP", "Noto Sans Devanagari", sans-serif`;
const MYMEMORY_CHUNK = 450;
const RENDER_SCALE = 2;

let pdfFile = null;
let ocrWorker = null;
let ocrWorkerLang = null;

/* ---------- UI ---------- */
Object.keys(TARGET_CODES).forEach((lang, i) => {
  const lab = document.createElement("label");
  lab.className = "chip";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = lang;
  cb.checked = i === 0;
  lab.append(cb, lang);
  $("langs").append(lab);
});

const drop = $("drop");
const fileIn = $("file");
drop.onclick = () => fileIn.click();
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
fileIn.onchange = () => setFile(fileIn.files[0]);

function setFile(f) {
  if (!f) return;
  if (!f.name.toLowerCase().endsWith(".pdf")) { alert("Please choose a PDF file."); return; }
  pdfFile = f;
  $("fileName").textContent = `${f.name} (${(f.size / 1048576).toFixed(2)} MB)`;
}

function log(msg) {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function setStatus(msg) { $("status").textContent = msg; }

/* ---------- Page analysis: find text lines with exact positions ---------- */
function textLines(content, vp) {
  const boxes = [];
  for (const it of content.items) {
    if (!it.str || !it.str.trim()) continue;
    const t = pdfjsLib.Util.transform(vp.transform, it.transform);
    boxes.push({ str: it.str, x: t[4], base: t[5], h: Math.hypot(t[2], t[3]), w: it.width * vp.scale });
  }
  boxes.sort((a, b) => a.base - b.base);

  const groups = [];
  let cur = null;
  for (const b of boxes) {
    if (cur && Math.abs(b.base - cur.base) < cur.h * 0.5) cur.items.push(b);
    else { if (cur) groups.push(cur); cur = { base: b.base, h: b.h, items: [b] }; }
  }
  if (cur) groups.push(cur);

  return groups.map(g => {
    g.items.sort((a, b) => a.x - b.x);
    const x0 = g.items[0].x;
    const x1 = Math.max(...g.items.map(i => i.x + i.w));
    return {
      text: g.items.map(i => i.str).join(" ").replace(/\s+/g, " ").trim(),
      x: x0, w: x1 - x0, base: g.base, h: g.h
    };
  });
}

function ocrLines(data) {
  const out = [];
  for (const b of data.blocks || [])
    for (const p of b.paragraphs || [])
      for (const l of p.lines || []) {
        const text = (l.text || "").trim();
        if (!text) continue;
        const { x0, y0, x1, y1 } = l.bbox;
        const h = y1 - y0;
        out.push({ text, x: x0, w: x1 - x0, base: y1 - h * 0.2, h });
      }
  return out;
}

async function renderCanvas(page, vp) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return canvas;
}

async function getOcr(lang) {
  if (ocrWorker && ocrWorkerLang === lang) return ocrWorker;
  if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; }
  log(`Loading OCR engine for "${lang}" (first run downloads language data)...`);
  ocrWorker = await Tesseract.createWorker(lang, 1);
  ocrWorkerLang = lang;
  return ocrWorker;
}

async function analyzePage(pdf, n, mode, ocrLang) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: RENDER_SCALE });
  let lines = textLines(await page.getTextContent(), vp);
  let method = "text";
  const textLen = lines.map(l => l.text).join("").replace(/\s/g, "").length;
  const needsOcr = mode === "force" || (mode === "auto" && textLen < 30);
  if (needsOcr && mode !== "off") {
    log(`Page ${n}: running OCR...`);
    const canvas = await renderCanvas(page, vp);
    const worker = await getOcr(ocrLang);
    const { data } = await worker.recognize(canvas, {}, { blocks: true });
    lines = ocrLines(data);
    method = "OCR";
  }
  return { n, page, vp, lines, method, width: vp.width / RENDER_SCALE, height: vp.height / RENDER_SCALE };
}

/* ---------- Translation (free MyMemory service, called from the visitor's browser) ---------- */
function splitText(text, max = MYMEMORY_CHUNK) {
  const pieces = [];
  for (const line of text.split("\n")) {
    if (line.length <= max) { pieces.push(line); continue; }
    let cur = "";
    for (const word of line.split(" ")) {
      if ((cur + " " + word).trim().length > max) { pieces.push(cur.trim()); cur = word; }
      else cur += " " + word;
    }
    if (cur.trim()) pieces.push(cur.trim());
  }
  const chunks = [];
  let buf = "";
  for (const p of pieces) {
    if (buf && (buf + "\n" + p).length > max) { chunks.push(buf); buf = p; }
    else buf = buf ? buf + "\n" + p : p;
  }
  if (buf) chunks.push(buf);
  return chunks;
}

async function myMemory(text, langpair) {
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
              "&langpair=" + encodeURIComponent(langpair);
  const res = await fetch(url);
  if (!res.ok) throw new Error("Translation service error " + res.status);
  const data = await res.json();
  if (String(data.responseStatus) !== "200") {
    throw new Error(data.responseDetails || "Translation failed. The free daily limit may have been reached.");
  }
  return data.responseData.translatedText;
}

async function translate(text, lang, ocrLang) {
  if (!/\p{L}/u.test(text)) return text; // numbers and symbols stay as they are
  const source = SOURCE_CODES[ocrLang.split("+")[0]] || "en-GB";
  const target = TARGET_CODES[lang];
  const out = [];
  for (const chunk of splitText(text)) {
    out.push(chunk.trim() ? await myMemory(chunk, `${source}|${target}`) : "");
  }
  return out.join("\n");
}

// Run fn over items with a fixed number of parallel workers
async function mapLimit(items, limit, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: limit }, async () => {
    while (i < items.length) {
      const idx = i++;
      await fn(items[idx], idx);
    }
  }));
}

/* ---------- Drawing the translated page ---------- */
function fitText(ctx, text, size, maxW) {
  let s = size;
  ctx.font = `${s}px ${FONT}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) {
    s = Math.max(size * maxW / w, size * 0.45);
    ctx.font = `${s}px ${FONT}`;
  }
  return s;
}

async function drawTranslatedPage(P, lang) {
  const canvas = await renderCanvas(P.page, P.vp);
  const ctx = canvas.getContext("2d");
  const rtl = RTL_LANGS.includes(lang);
  const pad = 2;

  // 1. Sample the background color behind each line before erasing anything
  const boxes = P.lines.map(L => {
    const x = L.x - pad, y = L.base - L.h * 0.85 - pad;
    const w = L.w + pad * 2, h = L.h * 1.1 + pad * 2;
    const px = ctx.getImageData(Math.max(0, Math.floor(x - 3)), Math.max(0, Math.floor(y + h / 2)), 1, 1).data;
    return { L, x, y, w, h, color: `rgb(${px[0]},${px[1]},${px[2]})` };
  });

  // 2. Erase original text
  for (const b of boxes) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // 3. Draw translated text in the same place
  ctx.fillStyle = "#111";
  for (const b of boxes) {
    const text = b.L.tr && b.L.tr[lang] ? b.L.tr[lang] : b.L.text;
    const maxW = Math.max(b.L.w, Math.min(b.L.w * 1.3, canvas.width - b.L.x - 10));
    fitText(ctx, text, b.L.h * 0.9, maxW);
    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(text, rtl ? b.L.x + maxW : b.L.x, b.L.base);
  }
  return canvas;
}

async function loadFonts() {
  await Promise.all([
    "16px 'Noto Sans'", "16px 'Noto Sans Arabic'", "16px 'Noto Sans SC'",
    "16px 'Noto Sans JP'", "16px 'Noto Sans Devanagari'"
  ].map(f => document.fonts.load(f).catch(() => {})));
}

/* ---------- Main pipeline ---------- */
$("start").onclick = run;

async function run() {
  if (!pdfFile) return alert("Choose a PDF first.");
  const langs = [...document.querySelectorAll("#langs input:checked")].map(i => i.value);
  if (!langs.length) return alert("Select at least one target language.");

  $("start").disabled = true;
  $("results").classList.add("hidden");
  $("downloads").innerHTML = "";
  $("previewTabs").innerHTML = "";
  $("preview").removeAttribute("src");
  setStatus("Working...");

  let total = 0, done = 0;
  const step = () => { done++; $("bar").style.width = Math.min(100, Math.round((done / total) * 100)) + "%"; };

  try {
    await loadFonts();
    const pdf = await pdfjsLib.getDocument({ data: await pdfFile.arrayBuffer() }).promise;
    const n = pdf.numPages;
    const mode = $("ocrMode").value;
    const ocrLang = $("ocrLang").value;
    log(`Opened "${pdfFile.name}" (${n} page${n > 1 ? "s" : ""}).`);

    // Step 1: find text and positions on every page
    const pages = [];
    for (let i = 1; i <= n; i++) {
      setStatus(`Reading page ${i}/${n}`);
      pages.push(await analyzePage(pdf, i, mode, ocrLang));
      step();
    }
    if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; ocrWorkerLang = null; }

    const totalLines = pages.reduce((s, p) => s + p.lines.length, 0);
    total = pages.length + totalLines * langs.length + pages.length * langs.length;
    done = pages.length;

    const base = pdfFile.name.replace(/\.pdf$/i, "");
    const blobs = {};

    for (const lang of langs) {
      // Step 2: translate every text line, keeping its position
      log(`Translating into ${lang} (${totalLines} text lines)...`);
      await mapLimit(
        pages.flatMap(p => p.lines.map(L => ({ L, p }))),
        3,
        async ({ L }) => {
          L.tr = L.tr || {};
          L.tr[lang] = await translate(L.text, lang, ocrLang);
          step();
        }
      );

      // Step 3: draw each page and build the PDF
      log(`Building ${lang} PDF...`);
      let doc = null;
      for (let i = 0; i < pages.length; i++) {
        const P = pages[i];
        setStatus(`${lang}: building page ${P.n}/${pages.length}`);
        const canvas = await drawTranslatedPage(P, lang);
        const img = canvas.toDataURL("image/jpeg", 0.92);
        const orient = P.width > P.height ? "landscape" : "portrait";
        if (!doc) doc = new jsPDF({ unit: "pt", format: [P.width, P.height], orientation: orient });
        else doc.addPage([P.width, P.height], orient);
        doc.addImage(img, "JPEG", 0, 0, P.width, P.height);
        step();
      }
      blobs[lang] = { blob: doc.output("blob"), name: `${base}_${lang}.pdf` };
    }

    showDownloads(blobs);
    log("Done. Your translated PDFs are ready.");
    setStatus("Finished");
  } catch (e) {
    log("Error: " + e.message);
    setStatus("Failed");
    alert("Something went wrong: " + e.message);
  } finally {
    $("start").disabled = false;
  }
}

function showDownloads(blobs) {
  const dl = $("downloads");
  const tabs = $("previewTabs");
  Object.entries(blobs).forEach(([lang, { blob, name }]) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.textContent = `Download ${lang} PDF`;
    a.className = "secondary";
    a.style.cssText = "border:1px solid #e3e6ec;border-radius:8px;padding:10px 18px;color:#1d2330;font-size:14px;text-decoration:none;background:#fff";
    dl.append(a);

    const b = document.createElement("button");
    b.className = "secondary";
    b.textContent = lang;
    b.onclick = () => { $("preview").src = url; };
    tabs.append(b);
  });
  $("results").classList.remove("hidden");
  const first = Object.values(blobs)[0];
  if (first) $("preview").src = URL.createObjectURL(first.blob);
}
</script>
</body>
</html>
