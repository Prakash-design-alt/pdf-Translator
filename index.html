<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Translator (Layout Preserved - Unlimited Local Translation)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Arabic&family=Noto+Sans+SC&family=Noto+Sans+JP&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
<!-- PDF & OCR Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Transformers.js for Unlimited Local Neural Translation -->
<script type="module">
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
  window.Transformers = { pipeline, env };
  // Allow loading models directly in browser via CDN
  env.allowLocalModels = false;
  env.useBrowserCache = true;
</script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#2563eb;--border:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px;background:var(--card);border-bottom:1px solid var(--border)}
h1{margin:0;font-size:20px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:1000px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
select, input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.hover{border-color:var(--accent);background:#eff6ff}
.drop strong{color:var(--text)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--text);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}
.bar div{height:100%;width:0;background:var(--accent);transition:width .3s}
#log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;height:160px;overflow:auto;white-space:pre-wrap;margin-top:12px}
.hidden{display:none!important}
iframe{width:100%;height:700px;border:1px solid var(--border);border-radius:8px;margin-top:12px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:999}
.loadbox{background:#fff;border-radius:12px;padding:28px 32px;width:min(420px,90vw);text-align:center}
.spinner{width:46px;height:46px;border:4px solid #e3e6ec;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadText{font-size:14px;color:var(--text);margin-bottom:12px;min-height:20px;word-break:break-word}
.footer{margin-top:24px;padding:18px 16px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--border);background:var(--card)}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>PDF Translator <span class="badge">Unlimited Local AI</span></h1>
  <p>Translates PDFs while preserving layout, tables, and images. Powered by client-side browser neural translation (no daily API limits).</p>
</header>

<main>
  <section class="card controls">
    <div class="grid">
      <div>
        <label for="ocrLang">Language of the PDF</label>
        <select id="ocrLang">
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="ur">Urdu</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="hi">Hindi</option>
          <option value="ru">Russian</option>
          <option value="zh">Chinese (Simplified)</option>
        </select>
      </div>
      <div>
        <label for="ocrMode">OCR mode</label>
        <select id="ocrMode">
          <option value="auto">Auto (only pages without text)</option>
          <option value="force">Always OCR</option>
          <option value="off">Never OCR</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <label>Target languages (select one or more)</label>
      <div class="langs" id="langs"></div>
    </div>
  </section>

  <section class="card">
    <div id="drop" class="drop">
      <strong>Click or drop a PDF here</strong>
      <div id="fileName" style="margin-top:6px;font-size:14px"></div>
    </div>
    <input id="file" type="file" accept="application/pdf" class="hidden">
    <div class="row">
      <button id="start">Translate PDF (Unlimited)</button>
      <span id="status" style="font-size:14px;color:var(--muted)"></span>
    </div>
  </section>

  <section class="card hidden" id="results">
    <div class="row" id="downloads"></div>
    <p class="note" id="previewNote"></p>
    <div class="row" id="previewTabs"></div>
  </section>
</main>

<div id="loading" class="overlay hidden">
  <div class="loadbox">
    <div class="spinner"></div>
    <div id="loadText">Initializing AI model...</div>
    <div class="bar"><div id="bar"></div></div>
  </div>
</div>

<footer class="footer">
  <div class="wrap">
    <span>© <span id="yr">2026</span> Next2pdf. Built by Prakash Budhathoki.</span>
  </div>
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { jsPDF } = window.jspdf;

const $ = id => document.getElementById(id);

// Language codes mapping for Tesseract OCR and M2M100 Model
const LANG_MAP = {
  "en": { name: "English", tesseract: "eng", m2m: "en" },
  "ar": { name: "Arabic", tesseract: "ara", m2m: "ar" },
  "ur": { name: "Urdu", tesseract: "urd", m2m: "ur" },
  "fr": { name: "French", tesseract: "fra", m2m: "fr" },
  "de": { name: "German", tesseract: "deu", m2m: "de" },
  "es": { name: "Spanish", tesseract: "spa", m2m: "es" },
  "hi": { name: "Hindi", tesseract: "hin", m2m: "hi" },
  "ru": { name: "Russian", tesseract: "rus", m2m: "ru" },
  "zh": { name: "Chinese (Simplified)", tesseract: "chi_sim", m2m: "zh" },
  "tr": { name: "Turkish", tesseract: "tur", m2m: "tr" },
  "ja": { name: "Japanese", tesseract: "jpn", m2m: "ja" },
  "pt": { name: "Portuguese", tesseract: "por", m2m: "pt" },
  "it": { name: "Italian", tesseract: "ita", m2m: "it" }
};

const RTL_LANGS = ["ar", "ur"];
const FONT = `"Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans JP", "Noto Sans Devanagari", sans-serif`;
const RENDER_SCALE = 2;

let pdfFile = null;
let ocrWorker = null;
let ocrWorkerLang = null;

// Local Neural Machine Translation Pipeline
let translationPipeline = null;
let previewWin = null;
let failedMsgs = [];

/* ---------- UI Initialization ---------- */
const targetList = ["ar", "ur", "fr", "es", "de", "zh", "hi", "ru", "tr", "ja", "pt", "it", "en"];
targetList.forEach((code, i) => {
  const info = LANG_MAP[code];
  const lab = document.createElement("label");
  lab.className = "chip";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = code;
  cb.checked = i === 0;
  lab.append(cb, info.name);
  $("langs").append(lab);
});

const drop = $("drop");
const fileIn = $("file");
drop.onclick = () => fileIn.click();
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
fileIn.onchange = () => setFile(fileIn.files[0]);

function setFile(f) {
  if (!f) return;
  if (!f.name.toLowerCase().endsWith(".pdf")) { alert("Please choose a PDF file."); return; }
  pdfFile = f;
  $("fileName").textContent = `${f.name} (${(f.size / 1048576).toFixed(2)} MB)`;
}

function log(msg) { console.log(`[${new Date().toLocaleTimeString()}] ${msg}`); }
function setStatus(msg) {
  $("status").textContent = msg;
  $("loadText").textContent = msg;
}

/* ---------- Local Neural Translation Engine ---------- */
async function getTranslator() {
  if (translationPipeline) return translationPipeline;
  setStatus("Loading Local AI Neural Model (~120MB, cached after 1st download)...");
  
  // Wait until Transformers library is ready
  const libStart = Date.now();
  while (!window.Transformers) {
    if (Date.now() - libStart > 30000) {
      throw new Error("The AI library could not load. Check your internet connection and try again.");
    }
    await new Promise(r => setTimeout(r, 100));
  }
  
  // Load Xenova/m2m100_418M model for offline / unlimited multilingual translations
  translationPipeline = await window.Transformers.pipeline(
    'translation',
    'Xenova/m2m100_418M',
    {
      progress_callback: (p) => {
        if (p.status === 'progress') {
          const pct = Math.round(p.progress || 0);
          setStatus(`Downloading Neural Model (${p.file || 'weights'}): ${pct}%`);
          $("bar").style.width = pct + "%";
        }
      }
    }
  );
  return translationPipeline;
}

async function translateText(text, srcCode, tgtCode) {
  if (!/\p{L}/u.test(text)) return text; // Preserve numbers and punctuation
  try {
    const translator = await getTranslator();
    const output = await translator(text, {
      src_lang: LANG_MAP[srcCode]?.m2m || srcCode,
      tgt_lang: LANG_MAP[tgtCode]?.m2m || tgtCode
    });
    return output[0]?.translation_text || text;
  } catch (err) {
    console.error("Local translation error:", err);
    failedMsgs.push(err.message);
    return text;
  }
}

/* ---------- PDF Text Line Analysis ---------- */
function textLines(content, vp) {
  const boxes = [];
  for (const it of content.items) {
    if (!it.str || !it.str.trim()) continue;
    const t = pdfjsLib.Util.transform(vp.transform, it.transform);
    boxes.push({ str: it.str, x: t[4], base: t[5], h: Math.hypot(t[2], t[3]), w: it.width * vp.scale });
  }
  boxes.sort((a, b) => a.base - b.base);

  const groups = [];
  let cur = null;
  for (const b of boxes) {
    if (cur && Math.abs(b.base - cur.base) < cur.h * 0.5) cur.items.push(b);
    else { if (cur) groups.push(cur); cur = { base: b.base, h: b.h, items: [b] }; }
  }
  if (cur) groups.push(cur);

  return groups.map(g => {
    g.items.sort((a, b) => a.x - b.x);
    const x0 = g.items[0].x;
    const x1 = Math.max(...g.items.map(i => i.x + i.w));
    return {
      text: g.items.map(i => i.str).join(" ").replace(/\s+/g, " ").trim(),
      x: x0, w: x1 - x0, base: g.base, h: g.h
    };
  });
}

function ocrLines(data) {
  const out = [];
  for (const b of data.blocks || [])
    for (const p of b.paragraphs || [])
      for (const l of p.lines || []) {
        const text = (l.text || "").trim();
        if (!text) continue;
        const { x0, y0, x1, y1 } = l.bbox;
        const h = y1 - y0;
        out.push({ text, x: x0, w: x1 - x0, base: y1 - h * 0.2, h });
      }
  return out;
}

async function renderCanvas(page, vp) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return canvas;
}

async function getOcr(langCode) {
  const tessLang = LANG_MAP[langCode]?.tesseract || "eng";
  if (ocrWorker && ocrWorkerLang === tessLang) return ocrWorker;
  if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; }
  log(`Loading OCR engine for "${tessLang}"...`);
  ocrWorker = await Tesseract.createWorker(tessLang, 1);
  ocrWorkerLang = tessLang;
  return ocrWorker;
}

async function analyzePage(pdf, n, mode, sourceLangCode) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: RENDER_SCALE });
  let lines = textLines(await page.getTextContent(), vp);
  let method = "text";
  const textLen = lines.map(l => l.text).join("").replace(/\s/g, "").length;
  const needsOcr = mode === "force" || (mode === "auto" && textLen < 30);
  if (needsOcr && mode !== "off") {
    log(`Page ${n}: running OCR...`);
    const canvas = await renderCanvas(page, vp);
    const worker = await getOcr(sourceLangCode);
    const { data } = await worker.recognize(canvas, {}, { blocks: true });
    lines = ocrLines(data);
    method = "OCR";
  }
  return { n, page, vp, lines, method, width: vp.width / RENDER_SCALE, height: vp.height / RENDER_SCALE };
}

/* ---------- Drawing Translated PDF Pages ---------- */
function fitText(ctx, text, size, maxW) {
  let s = size;
  ctx.font = `${s}px ${FONT}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) {
    s = Math.max(size * maxW / w, size * 0.45);
    ctx.font = `${s}px ${FONT}`;
  }
  return s;
}

async function drawTranslatedPage(P, tgtCode) {
  const canvas = await renderCanvas(P.page, P.vp);
  const ctx = canvas.getContext("2d");
  const rtl = RTL_LANGS.includes(tgtCode);
  const pad = 2;

  // 1. Sample background behind lines
  const boxes = P.lines.map(L => {
    const x = L.x - pad, y = L.base - L.h * 0.85 - pad;
    const w = L.w + pad * 2, h = L.h * 1.1 + pad * 2;
    const px = ctx.getImageData(Math.max(0, Math.floor(x - 3)), Math.max(0, Math.floor(y + h / 2)), 1, 1).data;
    return { L, x, y, w, h, color: `rgb(${px[0]},${px[1]},${px[2]})` };
  });

  // 2. Erase original text area
  for (const b of boxes) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // 3. Draw translated text in original layout coordinates
  ctx.fillStyle = "#111";
  for (const b of boxes) {
    const text = b.L.tr && b.L.tr[tgtCode] ? b.L.tr[tgtCode] : b.L.text;
    const maxW = Math.max(b.L.w, Math.min(b.L.w * 1.3, canvas.width - b.L.x - 10));
    fitText(ctx, text, b.L.h * 0.9, maxW);
    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(text, rtl ? b.L.x + maxW : b.L.x, b.L.base);
  }
  return canvas;
}

async function loadFonts() {
  await Promise.all([
    "16px 'Noto Sans'", "16px 'Noto Sans Arabic'", "16px 'Noto Sans SC'",
    "16px 'Noto Sans JP'", "16px 'Noto Sans Devanagari'"
  ].map(f => document.fonts.load(f).catch(() => {})));
}

/* ---------- Execution Pipeline ---------- */
$("start").onclick = run;

async function run() {
  if (!pdfFile) return alert("Choose a PDF file first.");
  const selectedTargets = [...document.querySelectorAll("#langs input:checked")].map(i => i.value);
  if (!selectedTargets.length) return alert("Select at least one target language.");

  const sourceLangCode = $("ocrLang").value;
  if (selectedTargets.includes(sourceLangCode)) {
    const sourceName = LANG_MAP[sourceLangCode].name;
    return alert(`The PDF is set to ${sourceName}, so ${sourceName} cannot be a target language. ` +
                 `Please untick it or change "Language of the PDF".`);
  }

  $("start").disabled = true;
  $("results").classList.add("hidden");
  $("loading").classList.remove("hidden");
  setStatus("Initializing local translation pipeline...");
  $("downloads").innerHTML = "";
  $("previewTabs").innerHTML = "";
  failedMsgs = [];
  previewWin = window.open("", "_blank");
  if (previewWin) {
    previewWin.document.title = "Translating...";
    previewWin.document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">Translating your PDF, please wait...</p>';
  }

  let total = 0, done = 0;
  const step = () => { done++; $("bar").style.width = Math.min(100, Math.round((done / total) * 100)) + "%"; };

  try {
    await loadFonts();
    
    // Pre-warm local AI model
    await getTranslator();

    const pdf = await pdfjsLib.getDocument({ data: await pdfFile.arrayBuffer() }).promise;
    const n = pdf.numPages;
    const mode = $("ocrMode").value;
    log(`Opened "${pdfFile.name}" (${n} page${n > 1 ? "s" : ""}).`);

    // Step 1: Analyze text and positions
    const pages = [];
    for (let i = 1; i <= n; i++) {
      setStatus(`Reading PDF structure - Page ${i}/${n}`);
      pages.push(await analyzePage(pdf, i, mode, sourceLangCode));
      step();
    }
    if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; ocrWorkerLang = null; }

    const totalLines = pages.reduce((s, p) => s + p.lines.length, 0);
    total = pages.length + totalLines * selectedTargets.length + pages.length * selectedTargets.length;
    done = pages.length;

    const baseName = pdfFile.name.replace(/\.pdf$/i, "");
    const blobs = {};

    for (const tgtCode of selectedTargets) {
      const langName = LANG_MAP[tgtCode].name;
      log(`Translating locally into ${langName} (${totalLines} text lines)...`);
      
      let lineIndex = 0;
      for (const p of pages) {
        for (const L of p.lines) {
          lineIndex++;
          setStatus(`Translating ${langName}: Line ${lineIndex}/${totalLines}`);
          L.tr = L.tr || {};
          L.tr[tgtCode] = await translateText(L.text, sourceLangCode, tgtCode);
          step();
        }
      }

      // Step 3: Draw page layout and export PDF
      log(`Generating ${langName} PDF...`);
      let doc = null;
      for (let i = 0; i < pages.length; i++) {
        const P = pages[i];
        setStatus(`Building ${langName} PDF: Page ${P.n}/${pages.length}`);
        const canvas = await drawTranslatedPage(P, tgtCode);
        const img = canvas.toDataURL("image/jpeg", 0.92);
        const orient = P.width > P.height ? "landscape" : "portrait";
        if (!doc) doc = new jsPDF({ unit: "pt", format: [P.width, P.height], orientation: orient });
        else doc.addPage([P.width, P.height], orient);
        doc.addImage(img, "JPEG", 0, 0, P.width, P.height);
        step();
      }
      blobs[langName] = { blob: doc.output("blob"), name: `${baseName}_${tgtCode}.pdf` };
    }

    showDownloads(blobs);
    log("Complete. Translated PDFs ready with zero API limits.");
    setStatus("Finished");
  } catch (e) {
    log("Error: " + e.message);
    setStatus("Failed");
    if (previewWin && !previewWin.closed) previewWin.close();
    $("previewNote").textContent = "Translation failed: " + e.message;
    $("results").classList.remove("hidden");
    alert("An error occurred during translation: " + e.message);
  } finally {
    $("start").disabled = false;
    $("loading").classList.add("hidden");
  }
}

function showDownloads(blobs) {
  const dl = $("downloads");
  const tabs = $("previewTabs");
  let firstUrl = null;
  Object.entries(blobs).forEach(([langName, { blob, name }]) => {
    const url = URL.createObjectURL(blob);
    if (!firstUrl) firstUrl = url;

    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.textContent = `Download ${langName} PDF`;
    a.className = "secondary";
    a.style.cssText = "border:1px solid #e3e6ec;border-radius:8px;padding:10px 18px;color:#1d2330;font-size:14px;text-decoration:none;background:#fff";
    dl.append(a);

    const v = document.createElement("button");
    v.className = "secondary";
    v.textContent = `View ${langName} PDF`;
    v.onclick = () => window.open(url, "_blank");
    tabs.append(v);
  });
  $("results").classList.remove("hidden");

  if (previewWin && !previewWin.closed) {
    previewWin.location.href = firstUrl;
    $("previewNote").textContent = "Your translated PDF opened in a new tab. Use the buttons below to view other languages.";
  } else {
    $("previewNote").textContent = "Click a View button to open your translated PDF in a new tab.";
  }
  if (failedMsgs.length) {
    $("previewNote").textContent += ` Note: ${failedMsgs.length} text part(s) could not be translated and kept their original text. Reason: ${failedMsgs[0]}`;
  }
}
</script>
</body>
</html>
